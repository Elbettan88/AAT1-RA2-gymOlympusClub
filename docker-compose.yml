services:
  mongodb:
    image: mongo:latest
    container_name: gym_mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: ./gym-backend
    container_name: gym_backend
    restart: always
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongodb:27017/gym_olympus
    depends_on:
      - mongodb

  frontend:
    build: ./gym-frontend
    container_name: gym_frontend
    restart: always
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  mongo_data:
